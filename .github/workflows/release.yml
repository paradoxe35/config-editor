name: Release

# Push a tag like `v0.1.0` to publish config-editor-leptos to crates.io and
# @pngwasi/config-editor and its React, Vue and Svelte packages to npm. The tag
# must match the version in every manifest.
#
# Each registry is published to only when its token is set as a repository
# secret; without it, that job does a dry run and says so:
#   CARGO_REGISTRY_TOKEN  crates.io
#   NPM_TOKEN             npm (an automation token with publish rights to the
#                         @pngwasi scope)
# A version already on a registry is skipped, so a release that failed
# halfway is finished by running the workflow again on the same tag.

on:
  push:
    tags: ["v*.*.*"]
  # A manual run builds, tests and packs everything without publishing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Versions match each other and the tag
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/config-editor-leptos/Cargo.toml | head -1)
          vanilla=$(node -p 'require("./js/config-editor/package.json").version')
          echo "crate=$crate vanilla=$vanilla"
          if [ "$crate" != "$vanilla" ]; then
            echo "::error::versions differ"; exit 1
          fi
          for wrapper in react vue svelte; do
            version=$(node -p "require('./js/config-editor-$wrapper/package.json').version")
            peer=$(node -p "require('./js/config-editor-$wrapper/package.json').peerDependencies['@pngwasi/config-editor']")
            echo "$wrapper=$version peer=$peer"
            if [ "$crate" != "$version" ]; then
              echo "::error::@pngwasi/config-editor-$wrapper is $version, not $crate"; exit 1
            fi
            if [ "$peer" != "^$crate" ]; then
              echo "::error::@pngwasi/config-editor-$wrapper must peer-depend on ^$crate"; exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $crate"; exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: versions
    uses: ./.github/workflows/ci.yml

  crate:
    name: Publish config-editor-leptos
    needs: [versions, ci]
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in `if:`; whether one is set can.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Already on crates.io?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'config-editor release (github actions)' \
            "https://crates.io/api/v1/crates/config-editor-leptos/$VERSION")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: github.event_name == 'push' && env.HAS_TOKEN == 'true' && steps.published.outputs.exists != 'true'
        run: cargo publish -p config-editor-leptos
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Already published
        if: steps.published.outputs.exists == 'true'
        run: echo "::notice::config-editor-leptos $VERSION is already on crates.io; skipped"
      - name: Dry run (manual run, or no CARGO_REGISTRY_TOKEN)
        if: (github.event_name != 'push' || env.HAS_TOKEN != 'true') && steps.published.outputs.exists != 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set: crates.io publish skipped (dry run only)"
          fi
          cargo publish -p config-editor-leptos --dry-run

  npm:
    name: Publish npm packages
    needs: [versions, ci]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      VERSION: ${{ needs.versions.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }}
      - name: Install wasm-opt (smaller .wasm)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build
        working-directory: js
        run: npm ci && npm run build
      - name: Publish @pngwasi/config-editor, then its React, Vue and Svelte packages
        working-directory: js
        run: |
          flags=(--access public)
          if [ "${{ github.event_name }}" = "push" ] && [ "$HAS_TOKEN" = "true" ]; then
            flags+=(--provenance)
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::NPM_TOKEN is not set: npm publish skipped (dry run only)"
            fi
            flags+=(--dry-run)
          fi
          # The core first: the framework packages peer-depend on it.
          for package in config-editor config-editor-react config-editor-vue config-editor-svelte; do
            if npm view "@pngwasi/$package@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::@pngwasi/$package $VERSION is already on npm; skipped"
            else
              npm publish --workspace "@pngwasi/$package" "${flags[@]}"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
