name: Release

# Push a tag like `v0.2.2` to publish leptos-config-editor to crates.io and
# @pngwasi/config-editor and its React, Vue and Svelte packages to npm. The tag
# must match the version in every manifest.
#
# Each registry is published to only when its token is set as a repository
# secret; without it, that job does a dry run and says so:
#   CARGO_REGISTRY_TOKEN  crates.io
#   NPM_TOKEN             npm (an automation token with publish rights to the
#                         @pngwasi scope)
# A version already on a registry is skipped, so a release that failed
# halfway is finished by running the workflow again on the same tag.

on:
  push:
    tags: ["v*.*.*"]
  # A manual run builds, tests and packs everything without publishing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Versions match each other and the tag
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/config-editor-leptos/Cargo.toml | head -1)
          vanilla=$(node -p 'require("./js/config-editor/package.json").version')
          echo "crate=$crate vanilla=$vanilla"
          if [ "$crate" != "$vanilla" ]; then
            echo "::error::versions differ"; exit 1
          fi
          for wrapper in react vue svelte; do
            version=$(node -p "require('./js/config-editor-$wrapper/package.json').version")
            peer=$(node -p "require('./js/config-editor-$wrapper/package.json').peerDependencies['@pngwasi/config-editor']")
            echo "$wrapper=$version peer=$peer"
            if [ "$crate" != "$version" ]; then
              echo "::error::@pngwasi/config-editor-$wrapper is $version, not $crate"; exit 1
            fi
            if [ "$peer" != "^$crate" ]; then
              echo "::error::@pngwasi/config-editor-$wrapper must peer-depend on ^$crate"; exit 1
            fi
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $crate"; exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  # The release publishes only a tree that passed the whole CI. CI usually
  # passed on this very commit already (the push to main, or the pull request
  # whose head it is): then that run is the proof, and CI does not run a
  # second time. scripts/ci-passed.mjs counts a run only when it tested
  # exactly this commit's tree (a push run on it; a pull request run whose
  # tested merge had a base this commit contains), with every CI job (push
  # and pull_request runs have no `part`), from this commit's own ci.yml.
  # Any doubt finds no run, and CI runs here as before.
  ci-passed:
    name: CI already passed on this commit?
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI runs and their logs
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        name: A successful CI run that tested ${{ github.sha }}
        run: node scripts/ci-passed.mjs "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci:
    name: CI
    needs: ci-passed
    if: needs.ci-passed.outputs.run == ''
    uses: ./.github/workflows/ci.yml

  crate:
    name: Publish leptos-config-editor
    needs: [versions, ci-passed, ci]
    # Either proof: the found run, or this release's own CI passed. (`ci` is
    # skipped when a run was found, so the default "every need succeeded"
    # would skip publishing too.)
    if: >-
      !cancelled() && needs.versions.result == 'success' && needs.ci-passed.result == 'success' &&
      (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci-passed.outputs.run != ''))
    runs-on: ubuntu-latest
    env:
      # Secrets cannot appear in `if:`; whether one is set can.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      VERSION: ${{ needs.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Already on crates.io?
        id: published
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'config-editor release (github actions)' \
            "https://crates.io/api/v1/crates/leptos-config-editor/$VERSION")
          echo "exists=$([ "$status" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: github.event_name == 'push' && env.HAS_TOKEN == 'true' && steps.published.outputs.exists != 'true'
        run: cargo publish -p leptos-config-editor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Already published
        if: steps.published.outputs.exists == 'true'
        run: echo "::notice::leptos-config-editor $VERSION is already on crates.io; skipped"
      - name: Dry run (manual run, or no CARGO_REGISTRY_TOKEN)
        if: (github.event_name != 'push' || env.HAS_TOKEN != 'true') && steps.published.outputs.exists != 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set: crates.io publish skipped (dry run only)"
          fi
          cargo publish -p leptos-config-editor --dry-run

  npm:
    name: Publish npm packages
    needs: [versions, ci-passed, ci]
    # The same proof as the crate's (see there).
    if: >-
      !cancelled() && needs.versions.result == 'success' && needs.ci-passed.result == 'success' &&
      (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci-passed.outputs.run != ''))
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      VERSION: ${{ needs.versions.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }},wasm-tools
      - name: Cache the pinned wasm-opt download
        uses: actions/cache@v4
        with:
          path: ~/.cache/binaryen
          key: binaryen-${{ hashFiles('scripts/install-binaryen.sh') }}
      - name: Install wasm-opt (pinned; tested by CI's e2e on the same build)
        run: scripts/install-binaryen.sh ~/.cache
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build
        working-directory: js
        run: npm ci && npm run build
      - name: The npm wasm loads in browsers without SIMD
        run: scripts/ci.sh wasm
      - name: Publish @pngwasi/config-editor, then its React, Vue and Svelte packages
        working-directory: js
        run: |
          flags=(--access public)
          if [ "${{ github.event_name }}" = "push" ] && [ "$HAS_TOKEN" = "true" ]; then
            flags+=(--provenance)
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::NPM_TOKEN is not set: npm publish skipped (dry run only)"
            fi
            flags+=(--dry-run)
          fi
          # The core first: the framework packages peer-depend on it.
          for package in config-editor config-editor-react config-editor-vue config-editor-svelte; do
            if npm view "@pngwasi/$package@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::@pngwasi/$package $VERSION is already on npm; skipped"
            else
              npm publish --workspace "@pngwasi/$package" "${flags[@]}"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
