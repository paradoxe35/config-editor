name: Release

# Push a tag like `v0.1.0` to publish config-editor-leptos to crates.io and
# @pngwasi/config-editor and @pngwasi/config-editor-react to npm. The tag must
# match the version in all three manifests.
#
# Repository secrets: CARGO_REGISTRY_TOKEN (crates.io) and NPM_TOKEN (an npm
# automation token with publish rights to the @pngwasi scope).

on:
  push:
    tags: ["v*.*.*"]
  # A manual run builds, tests and packs everything without publishing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Versions match each other and the tag
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/config-editor-leptos/Cargo.toml | head -1)
          vanilla=$(node -p 'require("./js/config-editor/package.json").version')
          react=$(node -p 'require("./js/config-editor-react/package.json").version')
          peer=$(node -p 'require("./js/config-editor-react/package.json").peerDependencies["@pngwasi/config-editor"]')
          echo "crate=$crate vanilla=$vanilla react=$react peer=$peer"
          if [ "$crate" != "$vanilla" ] || [ "$crate" != "$react" ]; then
            echo "::error::versions differ"; exit 1
          fi
          if [ "$peer" != "^$crate" ]; then
            echo "::error::@pngwasi/config-editor-react must peer-depend on ^$crate"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$crate" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $crate"; exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: versions
    uses: ./.github/workflows/ci.yml

  crate:
    name: Publish config-editor-leptos
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        if: github.event_name == 'push'
        run: cargo publish -p config-editor-leptos
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Dry run
        if: github.event_name != 'push'
        run: cargo publish -p config-editor-leptos --dry-run

  npm:
    name: Publish npm packages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }}
      - name: Install wasm-opt (smaller .wasm)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build
        working-directory: js
        run: npm ci && npm run build
      - name: Publish @pngwasi/config-editor, then @pngwasi/config-editor-react
        working-directory: js
        run: |
          flags="--access public"
          if [ "${{ github.event_name }}" = "push" ]; then
            flags="$flags --provenance"
          else
            flags="$flags --dry-run"
          fi
          npm publish --workspace @pngwasi/config-editor $flags
          npm publish --workspace @pngwasi/config-editor-react $flags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
