name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The steps live in scripts/ci.sh, so `scripts/ci.sh` runs them locally.
      - name: Formatting
        run: scripts/ci.sh fmt
      - name: Clippy (default features, wasm, every language without validation)
        run: scripts/ci.sh clippy
      - name: Tests
        run: scripts/ci.sh test
      - name: Each language feature on its own
        run: scripts/ci.sh languages
      - name: Every language without schema validation (completions and hover from the schema alone)
        run: scripts/ci.sh minimal
      - name: Each optional feature off, then all of them (search, diff, folding, protect)
        run: scripts/ci.sh optional

  browser:
    name: npm packages and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the npm packages
        working-directory: js
        run: npm ci && npm run build
      - name: Type-check the README examples (tsc, vue-tsc, svelte-check)
        working-directory: js
        run: npm run typecheck
      - name: Docs are up to date and well formed (contents lists, screenshot gallery, tables)
        run: scripts/ci.sh docs
      - name: Build the demo
        run: trunk build
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
