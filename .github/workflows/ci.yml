name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust checks as parallel jobs (each on its own runner); the steps
  # live in scripts/ci.sh, so `scripts/ci.sh` runs them all locally.
  rust:
    name: Rust (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: "fmt, clippy", steps: "fmt clippy" }
          - { name: tests, steps: test }
          - { name: each language alone, steps: languages }
          - { name: every language without schema validation, steps: minimal }
          - { name: without search, steps: optional, off: search }
          - { name: without diff, steps: optional, off: diff }
          - { name: without folding, steps: optional, off: folding }
          - { name: without protect, steps: optional, off: protect }
          - { name: "without any optional feature (yaml, json)", steps: optional, off: none }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check.steps }}-${{ matrix.check.off }}
      - name: scripts/ci.sh ${{ matrix.check.steps }}
        env:
          OPTIONAL_OFF: ${{ matrix.check.off }}
        run: scripts/ci.sh ${{ matrix.check.steps }}

  # The browser side: one job builds the npm packages and the demo once and
  # runs the package checks; the end-to-end tests then run from that build on
  # as many machines as the suite needs (one per TESTS_PER_MACHINE tests,
  # Playwright's --shard), the timed specs (speed budgets, one worker, alone)
  # on a runner of their own.
  browser-build:
    name: npm packages and the build the tests run
    runs-on: ubuntu-latest
    env:
      # Tests per end-to-end machine: the numbers that set how many run (the
      # timed specs run one at a time, so fewer per machine).
      TESTS_PER_MACHINE: 500
      TIMED_TESTS_PER_MACHINE: 30
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      timed_shards: ${{ steps.shards.outputs.timed_shards }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }},wasm-tools
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The release's wasm-opt, so the e2e tests run the wasm that is published.
      - name: Cache the pinned wasm-opt download
        uses: actions/cache@v4
        with:
          path: ~/.cache/binaryen
          key: binaryen-${{ hashFiles('scripts/install-binaryen.sh') }}
      - name: Install wasm-opt (pinned, as the release does)
        run: scripts/install-binaryen.sh ~/.cache
      - name: Build the npm packages
        working-directory: js
        run: npm ci && npm run build
      - name: Type-check the README examples (tsc, vue-tsc, svelte-check)
        working-directory: js
        run: npm run typecheck
      - name: The npm wasm loads in browsers without SIMD
        run: scripts/ci.sh wasm
      - name: Docs are up to date and well formed (contents lists, screenshot gallery, tables)
        run: scripts/ci.sh docs
      - name: Build the demo
        run: trunk build
      - name: How many machines the end-to-end tests need
        id: shards
        working-directory: e2e
        run: |
          npm ci
          machines() {
            local list total
            # A spec that throws while loading lists no test at all: fail
            # here rather than run zero tests and report success.
            list=$(npx playwright test --list --project="$1" --no-deps) || { echo "$list" >&2; exit 1; }
            total=$(sed -n 's/^Total: \([0-9]*\) tests.*/\1/p' <<< "$list")
            if (( ${total:-0} < 1 )); then
              echo "$list" >&2
              echo "::error::no $1 tests listed: a spec fails to load" >&2
              exit 1
            fi
            local count=$(( (total + $2 - 1) / $2 ))
            echo "$1: $total tests, $count machines of up to $2" >&2
            echo "[$(seq -s, 1 "$count")]"
          }
          echo "shards=$(machines editor "$TESTS_PER_MACHINE")" >> "$GITHUB_OUTPUT"
          echo "timed_shards=$(machines timed "$TIMED_TESTS_PER_MACHINE")" >> "$GITHUB_OUTPUT"
      - name: Keep the build for the test machines
        uses: actions/upload-artifact@v4
        with:
          name: browser-build
          retention-days: 1
          path: |
            dist/
            js/config-editor/pkg/
            js/config-editor-react/dist/
            js/config-editor-vue/dist/
            js/config-editor-svelte/dist/
            js/examples/dist/

  e2e:
    name: end-to-end tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: browser-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.browser-build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
      - name: Install the packages the tests import
        working-directory: js
        run: npm ci
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Dealt round-robin by test, not in runs: Playwright's --shard takes a
          # run of tests in file order, and the slow specs (the later QA rounds'
          # hover and echo matrices) sit together in it and shared a machine.
          npx playwright test --list --project=editor --no-deps | sed -n 's/^ *\(\[editor\] › .*\)$/\1/p' |
            awk -v i=${{ matrix.shard }} -v n=${{ strategy.job-total }} '(NR - 1) % n == i - 1' > editor-tests.txt
          echo "$(wc -l < editor-tests.txt) tests on this machine"
          npx playwright test --reporter=line,blob --project=editor --no-deps --test-list editor-tests.txt
      - name: Keep this machine's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          retention-days: 3
          path: e2e/blob-report/

  e2e-timed:
    name: end-to-end tests (timed, ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: browser-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.browser-build.outputs.timed_shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
      - name: Install the packages the tests import
        working-directory: js
        run: npm ci
      - name: End-to-end tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Dealt round-robin, not in runs: the slow specs sit together in the
          # file order Playwright's --shard follows, and would share a machine.
          npx playwright test --list --project=timed --no-deps | sed -n 's/^ *\(\[timed\] › .*\)$/\1/p' |
            awk -v i=${{ matrix.shard }} -v n=${{ strategy.job-total }} '(NR - 1) % n == i - 1' > timed-tests.txt
          echo "$(wc -l < timed-tests.txt) timed tests on this machine"
          npx playwright test --reporter=line --project=timed --no-deps --test-list timed-tests.txt

  # The memory tests again, against the npm package built with heap
  # statistics: they then also fail on a leak too small to grow the
  # WebAssembly memory. From the shared build (the demo, the framework
  # pages), with the core package rebuilt with the statistics.
  heap:
    name: memory tests with heap statistics
    needs: browser-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
          save-if: false
      - name: wasm-bindgen version from Cargo.lock
        id: versions
        run: echo "wasm_bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
      - name: Install the packages the tests import
        working-directory: js
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: scripts/ci.sh heap
        run: scripts/ci.sh heap

  # One HTML report from every machine's part, only when a test failed (an
  # artifact of the run, to look into the failure).
  e2e-report:
    name: end-to-end report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: Merge the reports
        working-directory: e2e
        run: |
          npm ci
          npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          retention-days: 7
          path: e2e/playwright-report/

  # The run keeps nothing it only needed while running: the shared build and
  # each machine's report go once every test job is done (or was cancelled);
  # only the merged report of a failed run stays.
  artifacts-cleanup:
    name: remove the run's working artifacts
    needs: [e2e, e2e-timed, heap, e2e-report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Through the run's own artifact service: no token permission needed.
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            browser-build
            blob-report-*
