[package]
name = "leptos-yaml-editor"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/yaml-editor"]
resolver = "3"

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
yaml-editor = { path = "crates/yaml-editor" }

# Keep the editor responsive while developing: dependencies (schema validation,
# YAML parsing) and the editor crate are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.yaml-editor]
opt-level = 2
