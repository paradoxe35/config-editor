[package]
name = "config-editor-demo"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/config-editor-leptos", "js/config-editor"]
resolver = "3"

# bytecount (through jsonschema) compiles WebAssembly SIMD into every wasm32
# build, and a browser without SIMD rejects the whole module. This fork
# compiles it only when the build enables simd128, so the npm package's wasm
# loads in every browser (upstream: llogiq/bytecount#94, #96, #106). It applies
# to this workspace's builds only; delete it once bytecount releases the fix,
# then `cargo update -p bytecount`.
[patch.crates-io]
bytecount = { git = "https://github.com/CharlesNg35/bytecount", rev = "f9dd655e3cadaba5d8941f5fe0c7ac2b026c5019" }

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.23", features = ["csr"] }
config-editor-leptos = { path = "crates/config-editor-leptos" }
web-sys = { version = "0.3", features = ["DomRect", "Element", "EventTarget", "FocusEvent", "History", "HtmlElement", "KeyboardEvent", "Location", "Node", "PointerEvent", "Window"] }
serde_json = "1"

# Keep the editor responsive while developing: dependencies (schema validation,
# YAML parsing) and the editor crate are optimised even in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.config-editor-leptos]
opt-level = 2

# Shipped wasm (the demo and the npm package): small over fast to compile.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
