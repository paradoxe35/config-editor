[package]
name = "leptos-config-editor"
version = "0.1.0"
edition = "2024"
description = "A reusable Leptos config editor with JSON Schema diagnostics and completions"
license = "MIT OR Apache-2.0"

[features]
default = ["schema-validation"]
# JSON Schema diagnostics, completions, and hover docs (the `jsonschema`
# dependency). Without it the editor still checks syntax.
schema-validation = ["dep:jsonschema"]

[dependencies]
jsonschema = { version = "0.60.2", default-features = false, optional = true }
regex = "1"
leptos = { version = "0.8.23", default-features = false, features = ["csr"] }
noyalib = { version = "0.0.58", default-features = false, features = ["std", "fast-int", "fast-float", "strict-deserialise", "compat-serde-yaml"] }
hcl-rs = "0.20.0"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "CssStyleDeclaration", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlCollection", "HtmlDivElement", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "MouseEvent", "TextMetrics", "Window"] }
