[web]
http = "127.0.0.1:8080"
https = 443
https_redirect = true
http2 = true
rate_limit = 200
request_header_timeout_secs = 30
idle_timeout_secs = 300
request_id = true
hsts = true
compress = true
max_body_size = "32MB"
response_header_timeout_secs = 60
error_pages = "errors/"
trusted_proxies = ["10.0.0.0/8", "192.168.0.0/16"]
proxy_protocol_from = ["10.10.0.1", "10.10.0.2"]

[web.access_log]
file = "logs/access.log"
format = "json"

[web.forward_auth.sso]
service = "keycloak"
path = "/realms/tunnel/protocol/openid-connect/auth"
copy_headers = ["X-Auth-User", "X-Auth-Email"]

[web.forward_auth.basic]
service = "outline"
path = "/auth/verify"
copy_headers = ["X-User", "X-Groups"]

[web.redirect_names]
"old.example.org" = "example.org"

[web.redirect_names."legacy.example.com"]
to = "example.com"
permanent = true

[web.redirect_names."beta.example.net"]
to = "example.net"
permanent = false

[web.request_headers]
X-Served-By = "tunnel"
X-Region = "eu-west"

[web.response_headers]
Server = "tunnel"
X-Content-Type-Options = "nosniff"

[[web.certificates]]
hosts = ["internal.example.org", "intranet.example.org"]
cert = "certs/internal/fullchain.pem"
key = "certs/internal/privkey.pem"

[[web.certificates]]
hosts = ["vpn.example.com", "wg.example.com"]
upload = "vpn-cert"

[web.letsencrypt]
email = "paradoxngwasi@outlook.com"
directory = "production"
profile = "tlsserver"

[[web.letsencrypt.dns]]
domains = ["example.org", "example.com"]
wildcards = ["*.example.org", "*.example.com"]
wait_secs = 60
resolvers = ["1.1.1.1:53", "1.0.0.1:53"]

[web.letsencrypt.dns.cloudflare]
token = "${CLOUDFLARE_API_TOKEN}"

[[web.letsencrypt.dns]]
domains = ["example.net", "lab.example.net"]
wait_secs = 120

[web.letsencrypt.dns.rfc2136]
server = "ns1.example.net:53"
key_name = "tunnel-acme"
secret = "${RFC2136_SECRET}"
algorithm = "hmac-sha256"

[[web.letsencrypt.dns]]
domains = ["acme.example.com", "edge.example.com"]

[web.letsencrypt.dns.acme_dns]
