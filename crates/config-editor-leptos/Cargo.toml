[package]
name = "config-editor-leptos"
version = "0.1.0"
edition = "2024"
description = "A lightweight VS Code-style Leptos editor for YAML, JSON, TOML, HCL, and XML configs, with JSON Schema completion, diagnostics, and conversion"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/paradoxe35/config-editor"
homepage = "https://github.com/paradoxe35/config-editor"
documentation = "https://docs.rs/config-editor-leptos"
keywords = ["leptos", "editor", "yaml", "json-schema", "config"]
categories = ["gui", "web-programming", "config", "text-editors", "wasm"]
include = ["src/**/*", "tests/**/*", "README.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["schema-validation", "yaml", "json", "toml", "hcl", "xml"]
# Live JSON Schema diagnostics (the `jsonschema` dependency, the heaviest
# part). Completions, hover docs and schema-shaped reading work without it;
# leave it out when the schema is checked elsewhere (on a server).
schema-validation = ["dep:jsonschema", "dep:regex"]
# Built-in languages; each enables `Language::<NAME>` and its parser. Disable
# the ones a host does not use to shrink the build.
yaml = ["dep:noyalib"]
json = []
toml = ["dep:toml"]
hcl = ["dep:hcl-rs"]
xml = ["dep:quick-xml"]

[dependencies]
jsonschema = { version = "0.60", default-features = false, optional = true }
# Matching `patternProperties`: the full engine `jsonschema` brings anyway when
# validating, else the small one (an unused engine is not linked).
regex = { version = "1", optional = true }
regex-lite = "0.1"
leptos = { version = "0.8.14", default-features = false, features = ["csr"] }
noyalib = { version = "0.0.58", optional = true, default-features = false, features = ["std", "fast-int", "fast-float", "strict-deserialise", "compat-serde-yaml"] }
hcl-rs = { version = "0.20", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", optional = true, features = ["preserve_order"] }
quick-xml = { version = "0.42", optional = true, features = ["serialize"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "ClipboardEvent", "console", "CssStyleDeclaration", "DataTransfer", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlCollection", "HtmlDivElement", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "MouseEvent", "TextMetrics", "WheelEvent", "Window"] }
