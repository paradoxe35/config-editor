[package]
name = "config-editor-leptos"
version = "0.1.0"
edition = "2024"
description = "A lightweight VS Code-style Leptos editor for YAML, JSON, TOML, HCL, and XML configs, with JSON Schema completion, diagnostics, and conversion"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
repository = "https://github.com/paradoxe35/config-editor"
homepage = "https://github.com/paradoxe35/config-editor"
documentation = "https://docs.rs/config-editor-leptos"
keywords = ["leptos", "editor", "yaml", "json-schema", "config"]
categories = ["gui", "web-programming", "config", "text-editors", "wasm"]
include = ["src/**/*", "tests/**/*", "preset.css", "README.md", "LICENSE", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["schema-validation", "yaml", "json", "toml", "hcl", "xml", "search", "diff", "folding", "protect"]
# Live JSON Schema diagnostics (the `jsonschema` dependency, the heaviest
# part). Completions, hover docs and schema-shaped reading work without it;
# leave it out when the schema is checked elsewhere (by the host's own checks).
schema-validation = ["dep:jsonschema", "dep:regex"]
# Built-in languages; each enables `Language::<NAME>` and its parser. Disable
# the ones a host does not use to shrink the build.
yaml = ["dep:noyalib"]
json = []
toml = ["dep:toml"]
hcl = ["dep:hcl-rs", "dep:hcl-edit"]
xml = ["dep:quick-xml"]
# Find and replace (`Ctrl+F`, `Ctrl+H`) and go to line (`Ctrl+G`).
search = []
# Read-only fields and secrets: the schema's `readOnly`, `writeOnly` and
# `x-secret`, and the `read_only_paths`, `read_only_ranges` and `secrets`
# props. The whole-document `read_only` works without it.
protect = []
# Changes against the baseline: the gutter markers and their before/after
# preview, revert, moving between changes, the change count
# (`on_change_summary`, `ChangeSummary`) and `unified_diff`.
diff = []
# Folding by structure: the gutter chevrons, the folding keys and the
# handle's `fold`, `unfold`, `fold_all`, `unfold_all` and `folded_lines`.
folding = []

[dependencies]
jsonschema = { version = "0.60", default-features = false, optional = true }
# Matching `patternProperties`: the full engine `jsonschema` brings anyway when
# validating, else the small one (an unused engine is not linked).
regex = { version = "1", optional = true }
regex-lite = "0.1"
leptos = { version = "0.8.14", default-features = false, features = ["csr"] }
noyalib = { version = "0.0.58", optional = true, default-features = false, features = ["std", "fast-int", "fast-float", "strict-deserialise", "compat-serde-yaml"] }
hcl-rs = { version = "0.20", optional = true }
# Its parser, for the heredoc text `hcl-rs` gives re-escaped (see `hcl/heredoc.rs`).
hcl-edit = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", optional = true, features = ["preserve_order"] }
quick-xml = { version = "0.42", optional = true, features = ["serialize"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "ClipboardEvent", "console", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "DomRectList", "Element", "Event", "EventTarget", "FocusEvent", "FocusOptions", "HtmlCanvasElement", "HtmlCollection", "HtmlDivElement", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "KeyboardEvent", "MediaQueryList", "MouseEvent", "Node", "NodeList", "Range", "ResizeObserver", "Text", "TextMetrics", "WheelEvent", "Window"] }
