# burrow server configuration (large demo); secrets show as fingerprints or ${ENV} names
listen = "0.0.0.0:7835"
public_address = "tunnel.pngwasi.me"
insecure_plaintext = false

[update]
remote = true

[websocket]
listen = "127.0.0.1:7836"
path = "/burrow"
host = "tunnel.pngwasi.me"
keepalive_secs = 20
challenge = "http"

[heartbeat]
interval_secs = 15

[limits]
handshake_timeout_secs = 5
max_handshakes = 4096
max_connections_per_client = 8192
max_pending = 512

[pool]
min_idle = 4
max_idle = 64

[tcp]
nodelay = true
keepalive_secs = 30

[udp]
session_timeout_secs = 120
max_peers = 4096

[metrics]
listen = "127.0.0.1:9464"

[self]
allow = ["127.0.0.1/32", "10.0.0.0/8"]

