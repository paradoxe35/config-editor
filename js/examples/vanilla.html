<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>config-editor (vanilla)</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #1e1e1e; color: #ddd; }
      header { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; }
      pre { margin: 0; padding: 8px 12px; white-space: pre-wrap; max-height: 25vh; overflow: auto; }
    </style>
  </head>
  <body>
    <header>
      <strong>config-editor</strong>
      <label>Edit as
        <select id="edit-as">
          <option value="">Same</option><option>json</option><option>toml</option><option>hcl</option><option>xml</option><option>env</option>
        </select>
      </label>
      <label>Theme <select id="theme"></select></label>
      <label><input id="read-only" type="checkbox" /> Read-only</label>
      <button id="replace" type="button">Replace value</button>
      <button id="destroy" type="button">Destroy</button>
      <button id="reveal" type="button">Go to insecure_plaintext</button>
      <label><input id="lock-address" type="checkbox" /> Lock public_address</label>
      <button id="load-secret" type="button">Load a secret</button>
      <label><input id="lock-first-line" type="checkbox" /> Lock line 1</label>
      <button id="server-change" type="button">Change on server</button>
      <span id="dirty"></span>
      <code id="breadcrumb"></code>
    </header>
    <div id="editor"></div>
    <pre id="saved"></pre>
    <script type="module">
      import { ConfigEditor, loadConfigEditor, registerLanguage, themes } from "../config-editor/index.js";
      import { validate } from "../config-editor/tools.js";

      await loadConfigEditor();
      const schema = await (await fetch("../../schema.json")).text();

      // A language written in JavaScript: KEY=value lines.
      registerLanguage({
        label: "ENV",
        icon: "E",
        extensions: ["env"],
        parse(text) {
          const value = {};
          text.split("\n").forEach((line, index) => {
            if (!line.trim() || line.trim().startsWith("#")) return;
            const at = line.indexOf("=");
            if (at < 0) throw { message: "expected KEY=value", line: index + 1, column: 1 };
            const raw = line.slice(at + 1).trim();
            value[line.slice(0, at).trim()] = /^-?\d+$/.test(raw) ? Number(raw) : raw === "true" ? true : raw === "false" ? false : raw;
          });
          return value;
        },
        serialize(value) {
          return Object.entries(value)
            .map(([key, item]) => {
              if (item !== null && typeof item === "object") throw { message: `${key}: env values are scalars` };
              return `${key}=${item}`;
            })
            .join("\n") + "\n";
        },
        keySpan(text, pointer) {
          const key = pointer.slice(1);
          const lines = text.split("\n");
          const index = lines.findIndex((line) => line.split("=")[0].trim() === key);
          return index < 0 ? null : { line: index + 1, startColumn: 1, endColumn: key.length + 1 };
        },
        highlight(line) {
          const at = line.indexOf("=");
          if (line.trim().startsWith("#")) return [{ start: 0, end: line.length, kind: "comment" }];
          if (at < 0) return [];
          return [
            { start: 0, end: at, kind: "key" },
            { start: at, end: at + 1, kind: "punctuation" },
            { start: at + 1, end: line.length, kind: "value" },
          ];
        },
      });

      const saved = document.getElementById("saved");
      window.saves = [];
      window.conflicts = [];
      const initial = "# Tunnel server configuration\nlisten: 7835\npublic_address: tunnel.example.com\ninsecure_plaintext: false\n";
      saved.textContent = initial;
      // For tests: `?options={...}` adds or overrides constructor options.
      const extra = JSON.parse(new URLSearchParams(location.search).get("options") ?? "{}");
      // The Edit-as language on screen ("" for the host's own).
      let onScreen = "";
      const editor = new ConfigEditor(document.getElementById("editor"), {
        language: "yaml",
        value: initial,
        schema,
        fileName: "tunnel.yaml",
        showToolbar: true,
        showFooter: true,
        onChange: (text) => (saved.textContent = text),
        // The select follows the language on screen, also when undo steps
        // back across a switch (the host's own language is "Same").
        onEditAsChange: (language) => {
          document.body.dataset.editing = language;
          const select = document.getElementById("edit-as");
          onScreen = [...select.options].some((option) => option.value === language) ? language : "";
          select.value = onScreen;
        },
        onPathChange: (path) => (document.getElementById("breadcrumb").textContent = path.pointer || "/"),
        secrets: { hint: "Keeps the stored secret" },
        // Explicit saves only: the saved text becomes the new baseline.
        onSave: (text, language) => {
          window.saves.push({ text, language });
          baseline = text;
          editor.update({ baseline: text });
        },
        onDirtyChange: (dirty) => (document.getElementById("dirty").textContent = dirty ? "unsaved" : "saved"),
        onBaselineConflict: (event) => window.conflicts.push(event),
        ...extra,
      });
      window.editor = editor;
      window.configEditor = { validate };

      const themeSelect = document.getElementById("theme");
      for (const { name } of themes()) themeSelect.append(new Option(name, name));
      // A theme given in `?options` shows as chosen.
      if (typeof extra.theme === "string") themeSelect.value = extra.theme;
      themeSelect.onchange = () => editor.update({ theme: themeSelect.value });
      // The select shows the language on screen: a switch that waits (the
      // document cannot convert yet, its problem says why) shows once done.
      document.getElementById("edit-as").onchange = (event) => {
        editor.update({ editAs: event.target.value || null });
        event.target.value = onScreen;
      };
      document.getElementById("read-only").onchange = (event) => editor.update({ readOnly: event.target.checked });
      document.getElementById("replace").onclick = () => editor.update({ value: "listen: 9000\n" });
      document.getElementById("destroy").onclick = () => editor.destroy();
      // Another client saved: the server's version moves on.
      let baseline = initial;
      document.getElementById("server-change").onclick = () => {
        baseline = baseline.replace("7835", "7836");
        editor.update({ baseline });
      };
      document.getElementById("reveal").onclick = () => editor.reveal("/insecure_plaintext");
      document.getElementById("load-secret").onclick = () =>
        editor.update({ value: "clients:\n  acme:\n    secret: «secret 3f2a»\n" });
      document.getElementById("lock-address").onchange = (event) =>
        editor.update({ readOnlyPaths: event.target.checked ? ["/public_address"] : [] });
      document.getElementById("lock-first-line").onchange = (event) =>
        editor.update({ readOnlyRanges: event.target.checked ? [{ startLine: 1, startColumn: 1, endLine: 2, endColumn: 1 }] : [] });
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
