[package]
name = "config-editor-js"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser bindings (wasm-bindgen) for leptos-config-editor: the `config-editor` npm package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.23", features = ["csr"] }
leptos-config-editor = { path = "../../crates/leptos-config-editor" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["HtmlElement"] }
