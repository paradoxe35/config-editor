[package]
name = "config-editor-js"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser bindings (wasm-bindgen) for config-editor-leptos: the `config-editor` npm package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.23", features = ["csr"] }
# `xsd`: XML Schema as a schema format (+46 KB gzip, measured by
# scripts/wasm-sizes.sh), shipped in the one npm wasm.
config-editor-leptos = { path = "../../crates/config-editor-leptos", features = ["xsd"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_path_to_error = "0.1"
serde_json = "1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["console", "css", "HtmlElement"] }

[features]
# Heap statistics for hunting leaks (see src/alloc_stats.rs); never published.
alloc-stats = []
