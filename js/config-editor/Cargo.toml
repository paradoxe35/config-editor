[package]
name = "config-editor-js"
version = "0.2.1"
edition = "2024"
publish = false
description = "Browser bindings (wasm-bindgen) for leptos-config-editor: the `config-editor` npm package"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
leptos = { version = "0.8.23", features = ["csr"] }
leptos-config-editor = { path = "../../crates/config-editor-leptos" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_path_to_error = "0.1"
serde_json = "1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["console", "css", "HtmlElement"] }

[features]
# Heap statistics for hunting leaks (see src/alloc_stats.rs); never published.
alloc-stats = []
# XML Schema as a schema format (`schemaFormat: "xsd"`): opt-in, as in the
# crate, because it adds more than 60 KB gzip (scripts/wasm-sizes.sh prices
# it); the published package leaves it out, `npm run build:xsd` builds one
# with it.
xsd = ["leptos-config-editor/xsd"]
